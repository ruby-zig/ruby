name: Zig

on:
  push:
    paths-ignore:
      - 'doc/**'
      - '**/man/*'
      - '**.md'
      - '**.rdoc'
      - '**/.document'
      - '.*.yml'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/man/*'
      - '**.md'
      - '**.rdoc'
      - '**/.document'
      - '.*.yml'
  merge_group:

concurrency:
  group: ${{ github.workflow }} / ${{ startsWith(github.event_name, 'pull') && github.ref_name || github.sha }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull') }}

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/ubuntu

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Create compiler wrappers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zig-bin"
          printf '#!/bin/sh\nexec zig cc "$@"\n' > "$RUNNER_TEMP/zig-bin/zig-cc"
          printf '#!/bin/sh\nexec zig c++ "$@"\n' > "$RUNNER_TEMP/zig-bin/zig-c++"
          chmod +x "$RUNNER_TEMP/zig-bin/zig-cc" "$RUNNER_TEMP/zig-bin/zig-c++"

      - uses: ./.github/actions/setup/directories
        with:
          checkout: ''
          builddir: build

      - name: Configure
        working-directory: build
        env:
          CC: ${{ runner.temp }}/zig-bin/zig-cc
          CXX: ${{ runner.temp }}/zig-bin/zig-c++
        run: >-
          ../configure -C
          --disable-install-doc
          --disable-yjit
          --disable-zjit

      - name: Build
        id: build
        working-directory: build
        continue-on-error: true
        run: make >make.log 2>&1

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        working-directory: build
        run: |
          tail -n 120 make.log
          exit 1

      - name: Test
        if: steps.build.outcome == 'success'
        working-directory: build
        run: make test

      - name: Publish the verified commit
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: 81f35ff519e0cbf072cb0ba65979a6e12f4172d4
          OLD_MASTER: 1e8de0918e7f2fa86a236f23610c81002cad9cef
          GIT_AUTHOR_NAME: Johnneylee Jack Rollins
          GIT_AUTHOR_EMAIL: Johnneylee.rollins@gmail.com
          GIT_COMMITTER_NAME: Johnneylee Jack Rollins
          GIT_COMMITTER_EMAIL: Johnneylee.rollins@gmail.com
        run: |
          cat > .github/workflows/zig.yml <<'YAML'
          name: Zig

          on:
            push:
              paths-ignore:
                - 'doc/**'
                - '**/man/*'
                - '**.md'
                - '**.rdoc'
                - '**/.document'
                - '.*.yml'
            pull_request:
              paths-ignore:
                - 'doc/**'
                - '**/man/*'
                - '**.md'
                - '**.rdoc'
                - '**/.document'
                - '.*.yml'
            merge_group:

          concurrency:
            group: ${{ github.workflow }} / ${{ startsWith(github.event_name, 'pull') && github.ref_name || github.sha }}
            cancel-in-progress: ${{ startsWith(github.event_name, 'pull') }}

          permissions:
            contents: read

          jobs:
            make:
              runs-on: ubuntu-latest
              timeout-minutes: 60

              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false

                - uses: ./.github/actions/setup/ubuntu

                - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
                  with:
                    version: 0.16.0
                    use-cache: false

                - name: Create compiler wrappers
                  shell: bash
                  run: |
                    mkdir -p "$RUNNER_TEMP/zig-bin"
                    printf '#!/bin/sh\nexec zig cc "$@"\n' > "$RUNNER_TEMP/zig-bin/zig-cc"
                    printf '#!/bin/sh\nexec zig c++ "$@"\n' > "$RUNNER_TEMP/zig-bin/zig-c++"
                    chmod +x "$RUNNER_TEMP/zig-bin/zig-cc" "$RUNNER_TEMP/zig-bin/zig-c++"

                - uses: ./.github/actions/setup/directories
                  with:
                    checkout: ''
                    builddir: build

                - name: Configure
                  working-directory: build
                  env:
                    CC: ${{ runner.temp }}/zig-bin/zig-cc
                    CXX: ${{ runner.temp }}/zig-bin/zig-c++
                  run: >-
                    ../configure -C
                    --disable-install-doc
                    --disable-yjit
                    --disable-zjit

                - name: Build
                  working-directory: build
                  run: make

                - name: Test
                  working-directory: build
                  run: make test
          YAML

          git add .github/workflows/zig.yml
          tree=$(git write-tree)
          commit=$(
            printf '%s\n\n%s\n' \
              'CI: test Ruby with Zig cc' \
              'Configure Ruby with Zig 0.16.0 as the C and C++ compiler, then run the standard build and test targets. Keep the JITs disabled so this job exercises the native toolchain without adding Rust linker configuration.' |
              git commit-tree "$tree" -p "$BASE_SHA"
          )
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$commit:refs/heads/master" \
            --force-with-lease="refs/heads/master:${OLD_MASTER}"
