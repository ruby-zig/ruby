name: Zig CC

on:
  push:
    branches:
      # Pushes to these four certified shared branches are the ONLY
      # pushes that trigger a Zig CC run; every other branch (and all
      # tag pushes) intentionally gets no run at all. See the resolve
      # allowlist in ruby-zig/toolchain .github/workflows/ziguanite.yml.
      - master
      - ruby_4_0
      - ruby_3_4
      - ruby_3_3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ruby-zig/toolchain/.github/workflows/ziguanite.yml@25b68943e155e18351b125936c331636e210bfb5
