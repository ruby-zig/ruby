name: Zig CC

on:
  push:
    branches:
      # Push triggers: upstream master, the ruby_* release branches,
      # and the fleet's own ziguanite/* work branches — nothing else,
      # and never tag pushes. Triggering is not certification: the
      # resolve allowlist in ruby-zig/toolchain ziguanite.yml decides
      # which refs actually build; triggering refs outside it fail
      # closed there.
      - master
      - ruby_*
      - ziguanite/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ruby-zig/toolchain/.github/workflows/ziguanite.yml@25b68943e155e18351b125936c331636e210bfb5
